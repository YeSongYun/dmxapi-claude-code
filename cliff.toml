# git-cliff 配置文件
# 用于生成专业的 Changelog
# 文档: https://git-cliff.org

[changelog]
# 更新日志头部（留空）
header = ""

# 每个版本的模板
body = """
{% if version %}\
    ## {{ version | trim_start_matches(pat="v") }} ({{ timestamp | date(format="%Y-%m-%d") }})
{% else %}\
    ## 未发布版本
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | upper_first }}
    {% for commit in commits %}
        - {{ commit.message | upper_first | split(pat="\n") | first }}{% set b = commit.body | default(value="") | trim | replace(from="\n", to=" ") | trim | truncate(length=160, end="…") %}{% if b %} —— {{ b }}{% endif %}\
    {% endfor %}
{% endfor %}
"""

# 更新日志尾部（留空）
footer = ""

# 是否删除前导和尾随空白
trim = true

[git]
# 是否解析 conventional commits
conventional_commits = true

# 是否过滤非 conventional 的 commits
filter_unconventional = false

# commit 分类规则
commit_parsers = [
    { message = "^feat", group = "🚀 新功能" },
    { message = "^fix", group = "🐛 问题修复" },
    { message = "^doc", group = "📖 文档" },
    { message = "^docs", group = "📖 文档" },
    { message = "^perf", group = "⚡ 性能优化" },
    { message = "^refactor", group = "♻️ 代码重构" },
    { message = "^style", group = "🎨 代码风格" },
    { message = "^test", group = "🧪 测试" },
    { message = "^build", group = "📦 构建" },
    { message = "^ci", group = "🔧 CI/CD" },
    { message = "^chore", group = "🔨 杂项" },
    # 非 conventional commits 分类到其他
    { message = ".*", group = "📝 其他更新" },
]

# 保护 breaking changes
protect_breaking_commits = false

# 过滤 commits
filter_commits = false

# tag 匹配模式 (支持 v1.0.0 和 1.0.0 格式)
tag_pattern = "v?[0-9].*"

# 按最新排序
sort_commits = "newest"
